services:
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      # KRaft configuration
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,SSL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,SSL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,SSL:SSL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      
      # SSL / mTLS Configuration
      KAFKA_SSL_KEYSTORE_FILENAME: broker.keystore.jks
      KAFKA_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/broker.keystore.jks
      KAFKA_SSL_KEYSTORE_CREDENTIALS: keystore_creds
      KAFKA_SSL_KEY_CREDENTIALS: key_creds
      KAFKA_SSL_TRUSTSTORE_FILENAME: broker.truststore.jks
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/broker.truststore.jks
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: truststore_creds
      KAFKA_SSL_CLIENT_AUTH: required # This enforces strict mTLS
      
      # Allow KRaft mode without ZooKeeper
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - ./certs:/etc/kafka/secrets:ro,z
    command:
      - bash
      - -c
      - |
        echo "Updating permissions for mounted secrets..."
        # Format the storage directory (required for KRaft)
        exec /etc/confluent/docker/run

  jobmanager:
    image: flink:1.17.1
    container_name: flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
    volumes:
      - ./flink_job:/opt/flink/usrlib
      - ./certs:/opt/flink/certs:ro,z

  taskmanager:
    image: flink:1.17.1
    container_name: flink-taskmanager
    depends_on:
      - jobmanager
    command: taskmanager
    scale: 1
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
    volumes:
      - ./flink_job:/opt/flink/usrlib
      - ./certs:/opt/flink/certs:ro,z

  neo4j:
    image: neo4j:5.13.0-enterprise
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_server_config_strict__validation_enabled=false
      - NEO4J_dbms_security_procedures_unrestricted=gds.*
      - NEO4J_dbms_security_procedures_allowlist=gds.*,apoc.*,db.cdc.*
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 12

  neo4j-init:
    image: neo4j:5.13.0-enterprise
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - ./graph_db:/scripts:ro,z
    entrypoint: ["bash", "-ec"]
    command:
      - >-
        cypher-shell -a bolt://neo4j:7687 -u neo4j -p password -d system
        "ALTER DATABASE neo4j SET OPTION txLogEnrichment 'FULL';";
        cypher-shell -a bolt://neo4j:7687 -u neo4j -p password -d neo4j -f /scripts/schema.cypher

  kafka-connect:
    image: confluentinc/cp-kafka-connect:7.4.0
    container_name: kafka-connect
    depends_on:
      kafka:
        condition: service_started
      neo4j-init:
        condition: service_completed_successfully
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: 'kafka:29092' # Using PLAINTEXT for internal connect for simplicity in this demo, though mTLS could be configured
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_GROUP_ID: compose-connect-group
      CONNECT_CONFIG_STORAGE_TOPIC: docker-connect-configs
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_FLUSH_INTERVAL_MS: 10000
      CONNECT_OFFSET_STORAGE_TOPIC: docker-connect-offsets
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_TOPIC: docker-connect-status
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"
    command:
      - bash
      - -c
      - |
        echo "Installing Neo4j Kafka Connector..."
        confluent-hub install --no-prompt neo4j/kafka-connect-neo4j:5.1.1
        /etc/confluent/docker/run
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18

  connect-init:
    image: python:3.11-slim
    depends_on:
      kafka-connect:
        condition: service_healthy
    volumes:
      - ./cdc:/config:ro,z
    working_dir: /config
    command: ["python", "register_connector.py"]

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"

  feast:
    build: ./feature_store
    container_name: feast
    depends_on:
      redis:
        condition: service_started
      connect-init:
        condition: service_completed_successfully
    volumes:
      - ./feature_store:/feature_store:rw,z
    working_dir: /feature_store
    command:
      - bash
      - -c
      - |
        python bootstrap_offline_store.py
        feast apply
        python verify_registry.py
        echo "Feast registry ready, starting CDC consumer..."
        python consumer.py

  graph-analytics:
    build: ./graph_db
    container_name: graph-analytics
    depends_on:
      connect-init:
        condition: service_completed_successfully
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: password
    volumes:
      - ./artifacts:/artifacts:rw,z
    command: ["python", "analytics_worker.py", "--interval-seconds", "60", "--limit", "500"]

volumes:
  neo4j-data:
  neo4j-logs:
